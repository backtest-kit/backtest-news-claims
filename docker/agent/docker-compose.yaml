services:
  agent-runtime:
    image: tripolskypetr/agent-runtime:latest
    platform: linux/amd64
    container_name: agent-runtime
    ports:
      - "10050:10050"
    env_file:
      - .env
    environment:
      - PORT=10050
      - DATA_DIR=/app/data
      - DB_PATH=/app/storage/agent-runtime.sqlite
      - LOGS_DIR=/app/logs
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10050/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

